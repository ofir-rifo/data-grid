name: CI
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CI: 'true'
  NX_DAEMON: 'false'
  NX_NO_CLOUD: 'true'
  NX_SKIP_REMOTE_CACHE: 'true'
  NX_SKIP_NX_CACHE: 'true'
  NX_ISOLATE_PLUGINS: 'false'
  NX_PARALLEL: '1'
  NODE_OPTIONS: --max-old-space-size=2048
jobs:
  checks:
    name: DataGrid checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck application, unit tests and browser tests
        run: pnpm run typecheck
      - name: Engineering policy tests
        timeout-minutes: 2
        run: pnpm nx run @org/playground:standards-test --excludeTaskDependencies --skipSync --parallel=1
      - name: Engineering standards (ESLint, Stylelint, file policy)
        timeout-minutes: 2
        run: pnpm run lint
      - name: Dead-code report (advisory)
        timeout-minutes: 2
        continue-on-error: true
        run: pnpm nx run @org/playground:dead-code-report --excludeTaskDependencies --skipSync --parallel=1
      - name: Unit tests
        run: pnpm run test:playground
      - name: Verify Vite bundle
        run: pnpm run build:playground
      - name: Install Chromium on runner
        run: pnpm exec playwright install --with-deps chromium
      - name: Bounded Chromium regressions
        timeout-minutes: 3
        env:
          GRID_TEST_PRODUCTION: '0'
          BASE_URL: http://localhost:4200
          PLAYWRIGHT_HTML_OPEN: never
          PWDEBUG: '0'
        run: pnpm nx run @org/playground:e2e --excludeTaskDependencies --skipSync --parallel=1 --args="e2e/flush-sync.spec.ts e2e/row-overflow.spec.ts --project=chromium --workers=1 --retries=0 --trace=off --reporter=line --global-timeout=120000 --timeout=30000"
